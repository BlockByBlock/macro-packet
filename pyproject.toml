[project]
name = "macro-packet"
version = "0.1.0"
description = "Local deterministic macro engine that emits compact state packets"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
macro-packet = "macro_packet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/macro_packet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
